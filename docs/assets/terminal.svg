  <text x="480" y="26" class="title" text-anchor="middle">probe — zsh</text>
  <line x1="0" y1="40" x2="960" y2="40" stroke="#1f242b"/>
  <clipPath id="cmdclip"><rect class="typing" x="28" y="48" height="22" width="433.42"/></clipPath>
  <text x="28" y="64" clip-path="url(#cmdclip)"><tspan fill="#5eead4">$</tspan><tspan fill="#e5e7eb"> probe mcp --call-readonly --pdf -- node server.js</tspan></text>
  
  <text x="28" y="108" class="l2" fill="#ffffff" font-weight="700">AVENZOQ Probe · MCP · node server.js</text>
  <text x="28" y="130" class="l3" fill="#6b7280">Server: demo-store-tools 1.0.0 · 6 tools</text>
  <text x="28" y="152" class="l4" fill="#6b7280">Read-only tools called: list_products, get_latest_reviews</text>
  
  <text x="28" y="196" class="l6"><tspan fill="#e879f9" font-weight="700">CRITICAL</tspan><tspan fill="#e5e7eb" xml:space="preserve"> get_weather            </tspan><tspan fill="#c9cdd3">Tool description contains &lt;IMPORTANT&gt; tags</tspan></text>
  <text x="28" y="218" class="l7"><tspan fill="#e879f9" font-weight="700">CRITICAL</tspan><tspan fill="#e5e7eb" xml:space="preserve"> get_weather            </tspan><tspan fill="#c9cdd3">Tool description references ~/.ssh/id_rsa</tspan></text>
  <text x="28" y="240" class="l8"><tspan fill="#e879f9" font-weight="700">CRITICAL</tspan><tspan fill="#e5e7eb" xml:space="preserve"> get_latest_reviews     </tspan><tspan fill="#c9cdd3">Tool output tells the model to ignore its instructions</tspan></text>
  <text x="28" y="262" class="l9"><tspan fill="#f87171" font-weight="700">HIGH    </tspan><tspan fill="#e5e7eb" xml:space="preserve"> run_command            </tspan><tspan fill="#c9cdd3">Tool grants code or command execution</tspan></text>
  <text x="28" y="284" class="l10"><tspan fill="#f87171" font-weight="700">HIGH    </tspan><tspan fill="#e5e7eb" xml:space="preserve"> (server)               </tspan><tspan fill="#c9cdd3">Private data and an outbound channel exposed together</tspan></text>
  <text x="28" y="306" class="l11"><tspan fill="#fbbf24" font-weight="700">MEDIUM  </tspan><tspan fill="#e5e7eb" xml:space="preserve"> run_command            </tspan><tspan fill="#c9cdd3">Claims to be read-only but changes state</tspan></text>
  <text x="28" y="328" class="l12"><tspan fill="#22d3ee" font-weight="700">LOW     </tspan><tspan fill="#e5e7eb" xml:space="preserve"> read_customer_records  </tspan><tspan fill="#c9cdd3">Free-form "query" parameter without constraints</tspan></text>
  <text x="28" y="350" class="l13" fill="#6b7280">…and 7 more</text>
  
  <text x="28" y="394" class="l15" fill="#e5e7eb">critical: 7 · high: 2 · medium: 2 · low: 3</text>
  <text x="28" y="416" class="l16" fill="#4ade80">✔ Reports written to reports/: report.md, report.json, report.html, report.pdf</text>
  <rect class="cursor l16" x="28" y="424" width="8" height="16" fill="#5eead4"/>
